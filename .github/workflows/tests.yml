name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest bitstring pycryptodome
      - name: Byte-compile package
        run: python -m compileall -q dScriptModule
      - name: Run tests
        run: pytest -v tests

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel (same as the release workflow)
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel and import it
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import dScriptModule; print(dScriptModule.__version__)"
